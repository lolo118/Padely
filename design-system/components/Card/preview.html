<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Card — Padely</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center} .stack{display:grid;gap:16px} </style>
</head>
<body>

<div class="row" style="align-items:stretch">
  <article class="pd-card pd-card-hover" style="width:300px;box-sizing:border-box">
    <div class="pd-card-row"><p class="pd-eyebrow">Mié 15 oct · 20:00</p><span class="pd-badge pd-badge-success pd-badge-dot">Confirmada</span></div>
    <h3 class="pd-card-title" style="margin-top:8px">Cancha 2 · 90 min</h3>
    <p class="pd-card-meta">Club Padely Central · Palermo</p>
    <div class="pd-card-foot"><span class="pd-stat-value" style="font-size:22px;line-height:24px">$ 15.000</span><span class="pd-ink-3" style="font-size:13px">seña $ 5.000 pagada</span></div>
  </article>
  <article class="pd-card pd-card-torneo" data-theme="dark" style="width:320px;box-sizing:border-box">
    <div class="pd-card-row"><p class="pd-eyebrow">Inscripción abierta</p><span class="pd-badge pd-badge-heat">Cierra en 5 días</span></div>
    <h3 class="pd-card-title" style="margin-top:10px">Abierto de Primavera</h3>
    <p class="pd-card-meta">7ma y 6ta Masculino · Club Padely Central · 18 y 19 oct · $ 12.000 por pareja</p>
    <div class="pd-card-foot"><button class="pd-btn pd-btn-sm pd-btn-primary">Anotarme</button><button class="pd-btn pd-btn-sm pd-btn-ghost" style="color:var(--on-night-muted)">Ver cuadros</button><span class="pd-ink-3" style="margin-left:auto;font-size:12px;color:var(--on-night-muted)">18 / 24 parejas</span></div>
  </article>
</div>
</body>
</html>
