<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Toast — Padely</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center} .stack{display:grid;gap:16px} </style>
</head>
<body>

<div class="row" style="align-items:flex-start">
  <div class="pd-toast" data-theme="dark" role="status"><svg class="pd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><div class="pd-toast-body"><strong>Reserva confirmada</strong><span>Cancha 2, mié 15 oct a las 20:00.</span></div><button class="pd-btn pd-btn-ghost">Ver</button></div>
  <div class="pd-toast pd-toast-danger" data-theme="dark" role="alert"><svg class="pd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div class="pd-toast-body"><strong>No se pudo guardar el resultado</strong><span>Revisá la conexión y volvé a intentar.</span></div></div>
</div>
</body>
</html>
