<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dialog — Padely</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center} .stack{display:grid;gap:16px} </style>
</head>
<body>

<div class="pd-dialog" role="dialog" aria-labelledby="t" aria-describedby="d" style="margin:0 auto">
  <h2 class="pd-dialog-title" id="t">¿Cancelar la reserva?</h2>
  <p class="pd-dialog-body" id="d">Cancha 2, mié 15 oct a las 20:00. La seña de $ 5.000 no se devuelve si cancelás con menos de 24 horas.</p>
  <div class="pd-dialog-actions"><button class="pd-btn">Volver</button><button class="pd-btn pd-btn-danger">Cancelar reserva</button></div>
</div>
</body>
</html>
