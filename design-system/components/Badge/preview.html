<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Badge — Padely</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center} .stack{display:grid;gap:16px} </style>
</head>
<body>

<div class="stack">
  <div class="row">
    <span class="pd-badge pd-badge-success pd-badge-dot">Confirmada</span>
    <span class="pd-badge pd-badge-warning pd-badge-dot">Pendiente de seña</span>
    <span class="pd-badge pd-badge-danger pd-badge-dot">Cancelada</span>
    <span class="pd-badge pd-badge-court">Inscripción abierta</span>
    <span class="pd-badge pd-badge-lime">En curso</span>
    <span class="pd-badge">Finalizado</span>
    <span class="pd-badge pd-badge-night">Turno fijo</span>
  </div>
  <div class="row">
    <span class="pd-badge">7ma</span><span class="pd-badge">Masculino</span><span class="pd-badge pd-badge-court">Cuadro A</span><span class="pd-badge pd-badge-lime">Clasifica</span>
  </div>
</div>
</body>
</html>
