<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Button — Padely</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center} .stack{display:grid;gap:16px} </style>
</head>
<body>

<div class="stack">
  <div class="row">
    <button class="pd-btn pd-btn-primary"><svg class="pd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Reservar turno</button>
    <button class="pd-btn">Ver detalle</button>
    <button class="pd-btn pd-btn-ghost">Cancelar</button>
    <button class="pd-btn pd-btn-danger">Rechazar</button>
    <button class="pd-btn pd-btn-primary" disabled>Guardando…</button>
  </div>
  <div class="row">
    <button class="pd-btn pd-btn-sm pd-btn-primary">Anotarme</button>
    <button class="pd-btn pd-btn-sm">Editar</button>
    <button class="pd-btn pd-btn-sm pd-btn-ghost">Ver todos</button>
    <button class="pd-btn pd-btn-icon" aria-label="Buscar"><svg class="pd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="pd-btn pd-btn-sm pd-btn-icon pd-btn-ghost" aria-label="Cerrar"><svg class="pd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
</div>
</body>
</html>
