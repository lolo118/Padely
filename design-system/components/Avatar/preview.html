<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Avatar — Padely</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center} .stack{display:grid;gap:16px} </style>
</head>
<body>

<div class="row">
  <span class="pd-avatar pd-avatar-sm" aria-hidden="true">JT</span>
  <span class="pd-avatar" aria-hidden="true">JT</span>
  <span class="pd-avatar pd-avatar-lg" aria-hidden="true">JT</span>
  <div class="pd-loading" style="padding:0"><span class="pd-spinner" aria-hidden="true"></span>Cargando…</div>
  <span class="pd-status"><svg class="pd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Guardado</span>
  <span class="pd-status pd-status-error"><svg class="pd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>No se guardó</span>
</div>
</body>
</html>
