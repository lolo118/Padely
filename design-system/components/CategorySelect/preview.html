<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CategorySelect — Padely</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center} .stack{display:grid;gap:16px} </style>
</head>
<body>

<div class="row" style="align-items:flex-start">
  <div style="width:300px">
    <label class="pd-field">
      <span class="pd-label">Mi categoría</span>
      <div class="pd-catselect">
        <button class="pd-catselect-btn" type="button" aria-haspopup="listbox" aria-expanded="true"><svg class="pd-rank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12H8" stroke="#84cc16" stroke-width="2"/><circle cx="15" cy="12" r="5.5" fill="#84cc16"/><path d="M11.975 7.875a6.875 6.875 0 0 1 0 8.25M18.025 7.875a6.875 6.875 0 0 0 0 8.25" stroke="#0b1220" stroke-width="1" opacity=".45"/></svg><b style="font-family:var(--font-display);font-size:18px">6ta</b><span class="pd-catselect-sub">Intermedia</span><svg class="pd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <ul class="pd-catselect-list is-static" role="listbox" aria-label="Categoría" style="margin-top:8px">
          <li class="pd-catselect-group">Nivel</li>
          <li class="pd-catselect-opt" role="option" aria-selected="false"><svg class="pd-rank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="12" r="5.5" stroke="#84cc16" stroke-width="2" stroke-dasharray="3 2.6"/></svg><b>8va</b><span>Primeros partidos</span></li><li class="pd-catselect-opt" role="option" aria-selected="false"><svg class="pd-rank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="12" r="5.5" fill="#84cc16"/><path d="M11.975 7.875a6.875 6.875 0 0 1 0 8.25M18.025 7.875a6.875 6.875 0 0 0 0 8.25" stroke="#0b1220" stroke-width="1" opacity=".45"/></svg><b>7ma</b><span>Iniciación</span></li><li class="pd-catselect-opt" role="option" aria-selected="true"><svg class="pd-rank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12H8" stroke="#84cc16" stroke-width="2"/><circle cx="15" cy="12" r="5.5" fill="#84cc16"/><path d="M11.975 7.875a6.875 6.875 0 0 1 0 8.25M18.025 7.875a6.875 6.875 0 0 0 0 8.25" stroke="#0b1220" stroke-width="1" opacity=".45"/></svg><b>6ta</b><span>Intermedia</span></li><li class="pd-catselect-opt" role="option" aria-selected="false"><svg class="pd-rank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9H8" stroke="#84cc16" stroke-width="2"/><path d="M4 15H8" stroke="#84cc16" stroke-width="2"/><circle cx="15" cy="12" r="5.5" fill="#84cc16"/><path d="M11.975 7.875a6.875 6.875 0 0 1 0 8.25M18.025 7.875a6.875 6.875 0 0 0 0 8.25" stroke="#0b1220" stroke-width="1" opacity=".45"/></svg><b>5ta</b><span>Intermedia alta</span></li><li class="pd-catselect-opt" role="option" aria-selected="false"><svg class="pd-rank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12H8" stroke="#84cc16" stroke-width="2"/><path d="M4 8H8" stroke="#84cc16" stroke-width="2"/><path d="M4 16H8" stroke="#84cc16" stroke-width="2"/><circle cx="15" cy="12" r="5.5" fill="#84cc16"/><path d="M11.975 7.875a6.875 6.875 0 0 1 0 8.25M18.025 7.875a6.875 6.875 0 0 0 0 8.25" stroke="#0b1220" stroke-width="1" opacity=".45"/></svg><b>4ta</b><span>Avanzada</span></li><li class="pd-catselect-opt" role="option" aria-selected="false"><svg class="pd-rank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12 9.5 8.6V15.4Z" fill="#84cc16" opacity=".55"/><path d="M4 12H8" stroke="#84cc16" stroke-width="2"/><circle cx="15" cy="12" r="5.5" fill="#84cc16"/><path d="M11.975 7.875a6.875 6.875 0 0 1 0 8.25M18.025 7.875a6.875 6.875 0 0 0 0 8.25" stroke="#0b1220" stroke-width="1" opacity=".45"/></svg><b>3era</b><span>Competitiva</span></li><li class="pd-catselect-opt" role="option" aria-selected="false"><svg class="pd-rank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12 9.5 8.2V15.8Z" fill="#84cc16" opacity=".55"/><circle cx="15" cy="12" r="5.5" fill="#84cc16"/><path d="M15.8 8.2 12.9 12.4h2.4l-1.3 3.4 3.3-4.6h-2.4z" fill="#0b1220"/></svg><b>2da</b><span>Alto rendimiento</span></li><li class="pd-catselect-opt" role="option" aria-selected="false"><svg class="pd-rank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12 9.5 8.2V15.8Z" fill="#84cc16" opacity=".55"/><circle cx="15" cy="12" r="5.5" fill="#84cc16"/><path d="M15 7.6l1.2 2.7 2.9.3-2.2 2 .7 2.9-2.6-1.5-2.6 1.5.7-2.9-2.2-2 2.9-.3z" fill="#0b1220"/></svg><b>1era</b><span>Elite</span></li><li class="pd-catselect-opt" role="option" aria-selected="false"><svg class="pd-rank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round"><defs><radialGradient id="g" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#f6dd8d"/><stop offset=".55" stop-color="#d9a927"/><stop offset="1" stop-color="#8b6514"/></radialGradient></defs><circle cx="12" cy="12" r="10" stroke="#d9a927" stroke-width="1.2" opacity=".7"/><circle cx="12" cy="12" r="6" fill="url(#g)"/><path d="M8.9 7.9a5.6 5.6 0 0 1 0 8.2M15.1 7.9a5.6 5.6 0 0 0 0 8.2" stroke="#8b6514" stroke-width="1" opacity=".7"/></svg><b>Libre</b><span>Sin tope</span></li>
        </ul>
      </div>
    </label>
  </div>
  <div style="width:300px">
    <label class="pd-field">
      <span class="pd-label">Categoría del torneo</span>
      <div class="pd-catselect">
        <button class="pd-catselect-btn" type="button" aria-haspopup="listbox" aria-expanded="false"><svg class="pd-rank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="12" r="5.5" fill="#84cc16"/><path d="M11.975 7.875a6.875 6.875 0 0 1 0 8.25M18.025 7.875a6.875 6.875 0 0 0 0 8.25" stroke="#0b1220" stroke-width="1" opacity=".45"/></svg><b style="font-family:var(--font-display);font-size:18px">7ma</b><span class="pd-catselect-sub">Masculino</span><svg class="pd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <ul class="pd-catselect-list is-static" role="listbox" aria-label="Categoría del torneo" style="margin-top:8px">
          <li class="pd-catselect-group">Por nivel</li>
          <li class="pd-catselect-opt" role="option" aria-selected="true"><svg class="pd-rank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="12" r="5.5" fill="#84cc16"/><path d="M11.975 7.875a6.875 6.875 0 0 1 0 8.25M18.025 7.875a6.875 6.875 0 0 0 0 8.25" stroke="#0b1220" stroke-width="1" opacity=".45"/></svg><b>7ma</b><span>Iniciación</span></li>
          <li class="pd-catselect-opt" role="option" aria-selected="false"><svg class="pd-rank" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12H8" stroke="#84cc16" stroke-width="2"/><circle cx="15" cy="12" r="5.5" fill="#84cc16"/><path d="M11.975 7.875a6.875 6.875 0 0 1 0 8.25M18.025 7.875a6.875 6.875 0 0 0 0 8.25" stroke="#0b1220" stroke-width="1" opacity=".45"/></svg><b>6ta</b><span>Intermedia</span></li>
          <li class="pd-catselect-group">Por suma de la pareja</li>
          <li class="pd-catselect-opt" role="option" aria-selected="false"><span class="pd-catselect-suma"><i></i><em>+</em><i></i></span><b>Suma 13</b><span>7ma + 6ta, 8va + 5ta…</span></li>
          <li class="pd-catselect-opt" role="option" aria-selected="false"><span class="pd-catselect-suma"><i></i><em>+</em><i></i></span><b>Suma 11</b><span>6ta + 5ta, 7ma + 4ta…</span></li>
        </ul>
      </div>
    </label>
    <p class="pd-help" style="margin-top:8px">La escalera, de abajo arriba: 8va · 7ma · 6ta · 5ta · 4ta · 3era · 2da · 1era · Libre.</p>
  </div>
</div>
</body>
</html>
