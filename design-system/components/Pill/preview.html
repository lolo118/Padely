<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pill — Padely</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0} body{padding:16px;} .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center} .stack{display:grid;gap:16px} </style>
</head>
<body>

<div class="stack">
  <div class="pd-pills" role="tablist" aria-label="Categoría">
    <button class="pd-pill" role="tab" aria-selected="true">Todas</button>
    <button class="pd-pill" role="tab" aria-selected="false">4ta</button>
    <button class="pd-pill" role="tab" aria-selected="false">5ta</button>
    <button class="pd-pill" role="tab" aria-selected="false">6ta</button>
    <button class="pd-pill" role="tab" aria-selected="false">7ma <span class="pd-count">12</span></button>
    <button class="pd-pill" role="tab" aria-selected="false">8va</button>
  </div>
  <div class="pd-pills" role="tablist" aria-label="Cuadro">
    <button class="pd-pill" role="tab" aria-selected="false">7ma Masculino</button>
    <button class="pd-pill" role="tab" aria-selected="true">6ta Masculino</button>
    <button class="pd-pill" role="tab" aria-selected="false">Sin cuadro <span class="pd-count">3</span></button>
  </div>
</div>
</body>
</html>
